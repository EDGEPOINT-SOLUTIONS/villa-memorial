# Standalone demo stack: SSR web + stub gateway serving recorded fixtures.
# Template DoD: `docker compose up --build` → app demos with zero backend.
services:
  web:
    build: .
    environment:
      AUTH_BASE_URL: http://stub-gateway:8080
      SECURE_COOKIES: "0"
      NEXT_PUBLIC_DEMO_HINTS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-4000}:3000"
    depends_on:
      - stub-gateway

  stub-gateway:
    build:
      context: .
      dockerfile: stub-gateway/Dockerfile
    environment:
      STUB_PORT: "8080"
